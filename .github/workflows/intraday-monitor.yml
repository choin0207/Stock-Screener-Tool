# 盤中（台北 09:00–13:30 = UTC 01:00–05:30）每 10 分鐘檢查監控清單成交量，
# 爆量警示 commit 到 docs/data/alerts.json，網頁每分鐘輪詢並跳出通知。
# UTC 0 時段（台北 08:00–08:50 開盤前）僅做市場風險訊號（VIX/美期/亞股/EWT），
# 供熔斷前兆紅黃綠燈判斷；持股個股燈號於交易時段內產生。
# 注意：GitHub Actions 排程屬盡力執行，尖峰時段可能延遲數分鐘。
name: Intraday Volume Monitor

on:
  schedule:
    - cron: "*/5 0-5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check volume spike
        run: python run_monitor.py
      - name: Commit alerts/state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "chore: 盤中量能監控更新 [skip ci]" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
