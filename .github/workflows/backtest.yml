# 歷史回測訓練（3 年）：重演 ①② 篩選、計算因子權重與跌前指標命中率。
# 每個交易日 10:07 UTC（台北 18:07，接在每日篩選之後）自動重跑，統計逐日更新；
# 也可手動觸發或推送 backtest-request.txt。首次跑 3 年資料約 2-3 小時，
# .cache 以 actions/cache 保留，之後每日增量約 20-30 分鐘。
# 結果 commit 到 docs/data/backtest.json，每日篩選自動用權重打分。
name: Backtest

on:
  schedule:
    - cron: "7 10 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "backtest-request.txt"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: backtest-cache-${{ github.run_id }}
          restore-keys: |
            backtest-cache-
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: python run_backtest.py
      # 失敗也要存快取，重跑才能接續（法人歷史+股價抓一次要 40 分鐘以上）
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: backtest-cache-${{ github.run_id }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/backtest.json
          git commit -m "chore: 更新一年回測結果 [skip ci]" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
