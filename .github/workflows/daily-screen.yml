# 每交易日 15:30（台北，= 07:30 UTC）自動執行每日篩選，
# 結果 commit 到 docs/data/，GitHub Pages 網頁即自動更新。
# 注意：此 workflow 需位於獨立 repo 的預設分支才會依排程執行。
name: Daily Screen

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run daily screen
        run: python run_screen.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add docs/data
          git commit -m "chore: 更新每日篩選結果 [skip ci]" || echo "no changes"
          git push
