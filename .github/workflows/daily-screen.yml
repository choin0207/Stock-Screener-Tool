# 每交易日 15:30 與 17:00（台北，= 07:30 / 09:00 UTC）自動執行每日篩選：
# 15:30 首跑（三大法人資料約 15:00 公布），17:00 補跑一次，
# 涵蓋較晚公布的持股轉讓申報與財報資料。
# 結果 commit 到 docs/data/，GitHub Pages 網頁即自動更新。
name: Daily Screen

on:
  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}
  push:
    paths:
      - "screen-request.txt"

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run daily screen
        run: python run_screen.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "chore: 更新每日篩選結果 [skip ci]" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
